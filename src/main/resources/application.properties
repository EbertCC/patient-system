# ──────────────────────────────────────────────
# Propiedades comunes a todos los perfiles.
# Las credenciales van en application-dev.properties
# (ese archivo NO se sube a git).
# ──────────────────────────────────────────────

spring.profiles.active=dev

server.port=8085

# Mostrar SQL sólo en desarrollo (el perfil dev puede sobreescribir esto)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=true
